name: Check teardown

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out teardown kit
        uses: actions/checkout@v4
        with:
          repository: iqrow/skills
          path: .tmp/skills
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install kit dependencies (verify reads PDFs with them)
        run: npm ci --prefix .tmp/skills/skills/learning/teardown/kit/src

      # Contributors get the base branch's guard, so a pull request cannot loosen it.
      # The owner's pull requests use their own guard and may change files outside teardowns/.
      - name: Guard pull request
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          OWNER: ${{ github.event.pull_request.author_association == 'OWNER' }}
        run: |
          if [ "$OWNER" = true ]; then
            node scripts/check-pr.mjs "$BASE_REF" --maintainer
          else
            mkdir -p .tmp
            git show "origin/${BASE_REF}:scripts/check-pr.mjs" > .tmp/check-pr.mjs
            node .tmp/check-pr.mjs "$BASE_REF"
          fi

      - name: Build and verify changed teardown
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          mapfile -t teardowns < <(
            git diff --name-only "origin/${BASE_REF}...HEAD" \
              | awk -F/ '$1 == "teardowns" && $2 != "" { print $2 }' \
              | sort -u
          )
          for teardown in "${teardowns[@]}"; do
            node .tmp/skills/skills/learning/teardown/kit/build.mjs --check "teardowns/$teardown"
            node .tmp/skills/skills/learning/teardown/kit/verify.mjs "teardowns/$teardown"
          done
